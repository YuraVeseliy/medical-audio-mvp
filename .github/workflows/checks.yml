name: Проверки аудиомодуля
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить декодер для быстрых проверок без моделей и микрофона
        # AV декодирует настоящие файлы; нейросетевые модели и аудиоустройства не нужны.
        run: python -m pip install av==16.0.1 numpy==2.2.6
      - name: Основные проверки и регрессии
        run: python scripts/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-checks
          path: reports/asr_checks
